name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN can be write-scoped; nothing in CI needs more than
# checkout access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to commit SHAs (not mutable tags) so a
      # repointed tag cannot inject code into the build.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint --max-warnings 0

      # Gated at critical only. The high-severity advisories outstanding today
      # are all in build-time transitives (postcss and brace-expansion via the
      # bundler, sharp via the icons script) and are not reachable by a request
      # to the deployed app. A gate that is red on day one gets disabled, so
      # those are surfaced weekly as an issue instead (see security-audit.yml).
      - name: Audit dependencies
        run: pnpm audit --audit-level critical --prod

      - name: Verify checked-in migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain -- drizzle)"

      - name: Production build
        run: pnpm build

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Browser safety tests
        run: pnpm test:e2e
