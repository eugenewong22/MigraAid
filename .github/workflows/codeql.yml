name: CodeQL

# Static analysis for the classes of bug review misses: injection, unsafe
# deserialisation, path traversal, weak crypto. Weekly plus on pull requests
# touching source, which keeps it useful without adding minutes to every push.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: github/codeql-action/init@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3.28.16
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3.28.16
